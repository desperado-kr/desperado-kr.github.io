<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The H - 공식 개발자 웹사이트</title>
  <style>
    :root {
      --bg: #0b1120;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .container {
      max-width: 640px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 36px 28px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      text-align: center;
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 9999px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    p.subtitle {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .apps {
      text-align: left;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
    }
    .app-title {
      font-size: 17px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .app-desc {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.5;
    }
    .links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 16px;
    }
    a.btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      color: var(--text);
      background: #334155;
      border-radius: 8px;
      transition: background 0.2s, color 0.2s;
    }
    a.btn:hover {
      background: var(--accent);
      color: #0f172a;
    }
    a.btn-primary {
      background: #0284c7;
      color: #fff;
    }
    a.btn-primary:hover {
      background: #38bdf8;
      color: #0f172a;
    }
    footer {
      margin-top: 28px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="container">
    <span class="badge">Official Developer Site</span>
    <h1>The H</h1>
    <p class="subtitle">모바일 앱 및 데이터 분석 솔루션을 개발합니다.</p>

    <div class="apps">
      <div class="app-title">🎰 6마틴 바카라 분석기 (Android)</div>
      <div class="app-desc">통계적 분석과 6단계 마틴게일 시뮬레이션을 제공하는 스마트 모바일 분석기</div>
    </div>

    <div class="links">
      <a href="https://sites.google.com/view/the-h-baccarat-privacy" target="_blank" rel="noopener noreferrer" class="btn btn-primary">개인정보처리방침 (Privacy Policy)</a>
      <a href="./app-ads.txt" class="btn">app-ads.txt 확인</a>
    </div>

    <footer>
      &copy; 2026 The H. All rights reserved.
    </footer>
  </div>
</body>
</html>
